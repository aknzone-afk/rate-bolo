<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>रेट बोलो — QR</title>
<style>
  @page { size: A4 portrait; margin: 0; }

  :root {
    --purple: #1a0b2e;
    --purple2: #2d1b4e;
    --gold: #d4a017;
    --rani: #e0407a;
    --grey: #6e647d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f2f0f5;
    font-family: 'Nirmala UI', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px;
    color: var(--purple);
  }

  .sheet {
    width: 210mm;
    min-height: 297mm;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 6px 40px rgba(26, 11, 46, 0.18);
  }

  .band {
    width: 100%;
    background: linear-gradient(160deg, var(--purple2), var(--purple));
    color: #fff;
    text-align: center;
    padding: 26mm 10mm 12mm;
  }
  .band h1 {
    font-size: 26mm;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: 0.5mm;
  }
  .band .sub {
    margin-top: 5mm;
    font-size: 5mm;
    letter-spacing: 3.2mm;
    color: var(--gold);
    font-weight: 600;
    text-indent: 3.2mm;
  }

  .qrwrap {
    margin: 16mm 0 0;
    padding: 7mm;
    border: 1.1mm solid var(--gold);
    border-radius: 6mm;
    background: #fff;
  }
  .qrwrap img {
    display: block;
    width: 108mm;
    height: 108mm;
    image-rendering: pixelated;   /* keeps QR modules crisp */
  }

  .steps {
    margin-top: 14mm;
    text-align: center;
    padding: 0 16mm;
  }
  .steps .big {
    font-size: 8.5mm;
    font-weight: 600;
    line-height: 1.5;
  }
  .steps .small {
    margin-top: 6mm;
    font-size: 6mm;
    color: var(--grey);
    line-height: 1.6;
  }
  .steps .small b { color: var(--rani); font-weight: 700; }

  .rule {
    width: 60mm;
    height: 0.8mm;
    background: var(--gold);
    border-radius: 1mm;
    margin: 12mm auto 0;
  }

  .url {
    margin-top: 7mm;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 4.6mm;
    color: var(--grey);
    letter-spacing: 0.15mm;
    word-break: break-all;
    text-align: center;
    padding: 0 12mm;
  }

  .foot {
    margin-top: auto;
    width: 100%;
    text-align: center;
    padding: 8mm;
    font-size: 4mm;
    color: var(--grey);
  }

  @media print {
    body { background: #fff; padding: 0; }
    .sheet { box-shadow: none; width: 100%; min-height: 100vh; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="band">
    <h1>रेट बोलो</h1>
    <div class="sub">B.B SYNTHETICS</div>
  </div>

  <div class="qrwrap">
    <img src="qr.png" alt="रेट बोलो app ka QR code">
  </div>

  <div class="steps">
    <div class="big">फ़ोन का कैमरा खोलिए<br>और यह QR स्कैन कीजिए</div>
    <div class="small">
      खुलने के बाद <b>Add to Home screen</b> दबाइए —<br>
      फ़ोन में app का icon बन जाएगा
    </div>
  </div>

  <div class="rule"></div>
  <div class="url">aknzone-afk.github.io/rate-bolo/</div>

  <div class="foot">रेट अपने आप हर घंटे update होते रहते हैं</div>
</div>

</body>
</html>
