<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>रेट बोलो — QR</title>
<style>
  @page { size: A4 portrait; margin: 0; }

  :root {
    --purple:  #1a0b2e;
    --purple2: #2d1b4e;
    --gold:    #d4a017;
    --rani:    #e0407a;
    --grey:    #6e647d;
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  html, body { background: #eceaf1; }

  body {
    font-family: 'Nirmala UI', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 10mm;
    color: var(--purple);
  }

  .sheet {
    width: 210mm;
    height: 297mm;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    box-shadow: 0 6px 40px rgba(26, 11, 46, 0.18);
  }

  /* ---- brand band ---- */
  .band {
    width: 100%;
    background: linear-gradient(160deg, var(--purple2) 0%, var(--purple) 100%);
    color: #fff;
    text-align: center;
    padding: 17mm 10mm 11mm;
  }
  .band h1 {
    font-size: 23mm;
    font-weight: 700;
    line-height: 1.12;
  }
  .band .sub {
    margin-top: 4mm;
    font-size: 4.4mm;
    letter-spacing: 3mm;
    text-indent: 3mm;
    color: var(--gold);
    font-weight: 600;
  }

  /* ---- QR ---- */
  .qrwrap {
    margin-top: 13mm;
    padding: 6mm;
    border: 1mm solid var(--gold);
    border-radius: 5mm;
    background: #fff;
  }
  .qrwrap img {
    display: block;
    width: 102mm;
    height: 102mm;
    image-rendering: pixelated;   /* keeps the QR modules hard-edged */
  }

  /* ---- instructions ---- */
  .steps { margin-top: 11mm; text-align: center; padding: 0 14mm; }
  .steps .big   { font-size: 7.8mm; font-weight: 600; line-height: 1.45; }
  .steps .small { margin-top: 5mm; font-size: 5.4mm; color: var(--grey); line-height: 1.55; }
  .steps .small b { color: var(--rani); font-weight: 700; }

  .rule {
    width: 55mm; height: 0.7mm;
    background: var(--gold); border-radius: 1mm;
    margin: 9mm auto 0;
  }

  .url {
    margin-top: 5mm;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 4.4mm;
    color: var(--grey);
    text-align: center;
  }

  .foot {
    margin-top: auto;
    width: 100%;
    text-align: center;
    background: #f6f4f9;
    border-top: 0.3mm solid #e3dfea;
    padding: 5mm;
    font-size: 4.2mm;
    color: var(--grey);
  }

  @media print {
    html, body { background: #fff; }
    body { padding: 0; display: block; }
    .sheet { box-shadow: none; width: 210mm; height: 297mm; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="band">
    <h1>रेट बोलो</h1>
    <div class="sub">B.B SYNTHETICS</div>
  </div>

  <div class="qrwrap">
    <img src="qr.png" alt="रेट बोलो app ka QR code">
  </div>

  <div class="steps">
    <div class="big">फ़ोन का कैमरा खोलिए<br>और यह QR स्कैन कीजिए</div>
    <div class="small">
      App खुलने के बाद <b>Add to Home screen</b> दबाइए —<br>
      फ़ोन में icon बन जाएगा, रोज़ वहीं से खोलिए
    </div>
  </div>

  <div class="rule"></div>
  <div class="url">aknzone-afk.github.io/rate-bolo/</div>

  <div class="foot">रेट अपने आप हर घंटे update होते रहते हैं</div>
</div>

</body>
</html>
