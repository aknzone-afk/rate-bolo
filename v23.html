      var err = (e && e.error) || '';
      // we cancelled it ourselves because a new number was pressed - not a failure
      if(err==='interrupted' || err==='canceled' || err==='cancelled') return;
      // a newer number has already taken over - this one is stale
      if(gen !== speakGen) return;
      if(hiFailed) return;
      // genuine hindi failure on this device - switch to plain digits from here on
      hiFailed = true;
      try{
        var f=new SpeechSynthesisUtterance(String(fallback));
        f.volume=1; f.rate=1; f.pitch=1;
        TTS.speak(f);
      }catch(e2){}
    };
    TTS.speak(u);
    setTimeout(function(){ try{ if(TTS.paused) TTS.resume(); }catch(e){} },300);
  }catch(e){}
}

var lastKey='', lastT=0;
function fire(h){
  var now=Date.now();
  if(h.key===lastKey && now-lastT<900) return;
  lastKey=h.key; lastT=now;
  showHit(h);
  say(h.rate, h.display||h.key);
}

// ---------- keypad ----------
var entry='', idleT=null, fireT=null, fired=false, firedVal='';
var IDLE=1000;
function render(){ elE.value=entry; }
function idleReset(){
  entry=''; fired=false; firedVal=''; render();
  // a wrong number clears off the screen too; a good rate stays up to be read
  if(missShown){
    elD.textContent='—'; elR.textContent='—'; fitRow(1);
    elT.className='ok'; elT.textContent='नंबर दबाइए'; missShown=false;
  }
}
function armIdle(){ clearTimeout(idleT); idleT=setTimeout(idleReset,IDLE); }
function fireEntry(){
  var v=entry;
  if(!RATES.hasOwnProperty(v)) return;
  fire({key:v,rate:RATES[v].r,display:RATES[v].d});
  fired=true; firedVal=v;
  armIdle();
}
function checkEntry(){
  if(!entry) return;
  if(RATES.hasOwnProperty(entry)){
    if(entry.charCodeAt(0)>57){ fireT=setTimeout(fireEntry,500); }
    else { fireEntry(); }
  } else if(!PFX[entry]){ showMiss(entry); }
}
function openKeyboard(){
  try{
    elE.readOnly=false;
    elE.removeAttribute('readonly');
    elE.removeAttribute('inputmode');
    elE.focus();
    try{ elE.setSelectionRange(elE.value.length, elE.value.length); }catch(e){}
    setTimeout(function(){ try{ elE.focus(); }catch(e){} },0);
  }catch(e){}
}
function keyPress(k){
  clearTimeout(idleT); clearTimeout(fireT);
  if(k==='K'){ openKeyboard(); return; }
  if(k==='X'){ entry=''; fired=false; firedVal='';
               elD.textContent='—'; elR.textContent='—'; fitRow(1);
               elT.className='ok'; elT.textContent='नंबर दबाइए'; }
  else if(k==='B'){
    // a number already spoke - backspace wipes it rather than editing it
    if(fired){ entry=''; fired=false; firedVal=''; }
    else entry=entry.slice(0,-1);
  }
  else {
    // a number already spoke - the next digit starts a fresh number
    if(fired){ entry=''; fired=false; firedVal=''; }
    if(entry.length<6) entry+=k;
  }
  render(); checkEntry(); armIdle();
}
var padEl=document.getElementById('pad');
var HASPTR = (typeof window!=='undefined') && !!window.PointerEvent;
var lastB=null;
function flashKey(b){
  if(lastB && lastB!==b) lastB.classList.remove('hit');
  b.classList.add('hit'); lastB=b;
  setTimeout(function(){ b.classList.remove('hit'); },140);
}
// press: paint + type straight away, hold the speech back
padEl.addEventListener('pointerdown',function(ev){
  var b=ev.target.closest('.k'); if(!b) return;
  flashKey(b);
  // the OS keyboard only opens from a release event - leave this key alone here
  if(b.getAttribute('data-k')==='K') return;
  pendingSpeech=null;
  deferSpeak=true;
  try{ keyPress(b.getAttribute('data-k')); } finally { deferSpeak=false; }
});
// release: this is the event Chrome accepts as user activation for speech
padEl.addEventListener('pointerup',function(ev){
  if(ev.target.closest('.k')) flushSpeech();
});
padEl.addEventListener('pointercancel',function(){ pendingSpeech=null; });
padEl.addEventListener('click',function(ev){
  var b=ev.target.closest('.k'); if(!b) return;
  var k=b.getAttribute('data-k');
  if(k==='K'){ openKeyboard(); return; }
  if(!HASPTR){ flashKey(b); keyPress(k); }
  flushSpeech();
});
elE.addEventListener('input',function(){
  clearTimeout(idleT); clearTimeout(fireT);
  var raw=(elE.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(fired && raw!==firedVal){
    // typing continued on top of a number that already spoke - keep only the new part
    if(raw.length>firedVal.length && raw.indexOf(firedVal)===0) raw=raw.slice(firedVal.length);
    fired=false; firedVal='';
  }
  entry=raw.slice(0,6);
  render(); checkEntry(); armIdle();
});
elE.addEventListener('blur',function(){ elE.readOnly=true; elE.setAttribute('inputmode','none'); });

// ---------- wake lock ----------
var wl=null;
function getWL(){ if('wakeLock' in navigator){ navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){}); } }
getWL();
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){ getWL(); }
});
</script>
